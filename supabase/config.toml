project_id = "pasape"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Auth de Supabase queda habilitado para futura migración desde Firebase,
# pero la autenticación real corre por Firebase y se valida vía JWT externo.
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"
