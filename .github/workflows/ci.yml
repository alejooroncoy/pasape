name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      # Los tests existían pero ningún workflow los corría: una regresión en
      # precios, firma de QR o antifraude mergeaba en verde.
      # Acá corren 229 tests deterministas en ~9s. Los 8 archivos
      # *.integration.test.ts golpean el Supabase remoto y se auto-saltan sin
      # credenciales (`describe.skipIf(!hasCreds)`), que es justo el caso de CI
      # — así el pipeline no hereda la flakiness de la red.
      - run: pnpm test
