<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Variante clara del badge — para contextos donde el fondo debe ser claro
       (ej. selector de cuenta de Google, favicons sobre fondo blanco).
       Fondo blancquito cálido + mascota en trazo oscuro + "chispazos" de morado/azul
       como acentos dispersos (no relleno) — evita el look "app-icon-gradiente-IA". -->
  <defs>
    <radialGradient id="chispa-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo blancquito cálido, sin gradiente, con hairline -->
  <rect x="6" y="6" width="500" height="500" rx="112" ry="112" fill="#fbfaff"/>
  <rect x="7" y="7" width="498" height="498" rx="111" ry="111" fill="none" stroke="rgba(28,20,60,.14)" stroke-width="2"/>

  <!-- Chispazos de color dispersos: morado + azul, distintos tamaños, asimétricos -->
  <circle cx="88" cy="96" r="14" fill="#7C3AED"/>
  <circle cx="120" cy="70" r="6" fill="#4F6DF5"/>
  <circle cx="430" cy="120" r="9" fill="#4F6DF5"/>
  <circle cx="404" cy="86" r="5" fill="#7C3AED"/>
  <circle cx="446" cy="380" r="11" fill="#7C3AED"/>
  <circle cx="418" cy="416" r="6" fill="#4F6DF5"/>
  <circle cx="70" cy="410" r="7" fill="#4F6DF5"/>
  <circle cx="96" cy="440" r="4" fill="#7C3AED"/>
  <!-- Chispazo tipo "estrella" (destello, no punto) cerca del hocico -->
  <path d="M 372 176 l 5 14 l 14 5 l -14 5 l -5 14 l -5 -14 l -14 -5 l 14 -5 z" fill="#4F6DF5"/>
  <path d="M 60 250 l 3.5 10 l 10 3.5 l -10 3.5 l -3.5 10 l -3.5 -10 l -10 -3.5 l 10 -3.5 z" fill="#7C3AED" opacity="0.7"/>

