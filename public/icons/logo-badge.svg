<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo Badge Pasape — Paleta: Azul (#4f6df5) + Morado (#7c3aed) + Blanco
       Diseño minimalista, sin fondos coloridos, con criterio de identidad.
       Monograma "P" geométrico que escala a cualquier tamaño (favicon, app icon, etc). -->

  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .logo-bg { fill: #0a0a0f; }
        .logo-ring { stroke: rgba(255,255,255,.08); }
      }
    </style>
  </defs>

  <!-- Fondo: casi-blanco en claro, casi-negro en oscuro (respeta preferencia del sistema) -->
  <rect width="512" height="512" class="logo-bg" fill="#fbfaff" rx="110"/>
  <!-- Hairline frontera -->
  <rect width="512" height="512" fill="none" class="logo-ring" stroke="rgba(28,20,60,.12)" stroke-width="2" rx="110"/>

  <!-- Símbolo: Monograma "P" modular con azul + morado + blanco -->
  <g transform="translate(140, 120)">
    <!-- Barra vertical principal: blanco/gris claro (estructura) -->
    <rect x="40" y="0" width="24" height="280" fill="#fbfaff" rx="12"/>

    <!-- Bucle superior: morado (acento principal) -->
    <path d="M 64 20 Q 160 20 160 110 Q 160 160 80 170 L 80 150 Q 140 145 140 110 Q 140 50 64 50 Z"
          fill="none" stroke="#7c3aed" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Detalle secundario: línea azul diagonal (dinamismo, energía nocturna) -->
    <line x1="52" y1="200" x2="130" y2="270" stroke="#4f6df5" stroke-width="16" stroke-linecap="round" opacity="0.8"/>

    <!-- Punto focal: intersección morado + azul -->
    <circle cx="80" cy="160" r="14" fill="#7c3aed"/>
    <circle cx="100" cy="180" r="8" fill="#4f6df5"/>
  </g>

  <!-- Variante oscura para contexto dark mode: ajusta colores automáticamente -->
  <style>
    @media (prefers-color-scheme: dark) {
      /* En tema oscuro, el blanco permanece blanco para contraste */
      /* Morado y azul se mantienen vibrantes */
    }
  </style>
</svg>
