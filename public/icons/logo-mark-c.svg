<?xml version="1.0" standalone="no"?>
<!-- Propuesta C v2: Ticket arch + perro asomando — closer al logo original.
     Mantiene: rounded top + base plana del ticket, dog elongated face + ear lavender +
     ojo + nariz + boca + manita asomando abajo. Estilo solid+chunky. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <defs>
    <linearGradient id="mark-c-grad" x1="0" y1="0" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C49BFF"/>
      <stop offset="0.55" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="mark-c-ear" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#C4A6EE"/>
    </linearGradient>
  </defs>

  <!-- Ticket arch: rounded top, sides rectos, base plana — como el original. -->
  <path
    fill="url(#mark-c-grad)"
    d="M22 102
       L 22 38
       C 22 21 35 8 50 8
       C 65 8 78 21 78 38
       L 78 102
       Z"
  />

  <!-- Dog peeking out from left: head elongated (más realista que circular). -->
  <g transform="translate(6, 36)">
    <!-- Head silhouette: forma elongada con muzzle hacia abajo -->
    <path
      fill="#FFFFFF"
      d="M0 30
         C 0 13 12 4 26 4
         L 32 4
         C 40 4 46 9 46 18
         L 46 34
         C 46 38 42 42 36 42
         L 8 42
         C 3 42 0 38 0 33
         Z"
    />
    <!-- Oreja lavender (la característica del original) -->
    <path
      fill="url(#mark-c-ear)"
      d="M28 0
         C 38 0 44 6 44 14
         C 44 20 38 24 32 24
         C 26 24 24 18 24 14
         C 24 6 26 0 28 0 Z"
    />
    <!-- Ojo (el detalle distintivo del original) -->
    <circle cx="20" cy="22" r="2.8" fill="#0A0A0F"/>
    <!-- Nariz pequeña triangular/oval -->
    <ellipse cx="6" cy="28" rx="3.2" ry="2.4" fill="#0A0A0F"/>
    <!-- Sonrisa curva sutil -->
    <path
      d="M3 32 Q 8 36 13 32"
      stroke="#0A0A0F"
      stroke-width="1.6"
      fill="none"
      stroke-linecap="round"
    />
  </g>

  <!-- Manita asomando abajo izquierda (detalle del original) -->
  <g transform="translate(10, 76)">
    <path
      fill="#FFFFFF"
      d="M0 14
         C 0 6 4 0 10 0
         L 14 0
         C 20 0 24 4 24 10
         L 24 18
         C 24 22 20 24 16 24
         L 4 24
         C 1 24 0 22 0 18
         Z"
    />
    <!-- Pequeños dedos sugeridos -->
    <circle cx="6" cy="20" r="1.5" fill="#0A0A0F" opacity="0.25"/>
    <circle cx="12" cy="22" r="1.5" fill="#0A0A0F" opacity="0.25"/>
    <circle cx="18" cy="20" r="1.5" fill="#0A0A0F" opacity="0.25"/>
  </g>
</svg>
